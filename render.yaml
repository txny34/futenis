# Render blueprint for the online server (cmd/server). Free plan: sleeps when idle.
services:
  - type: web
    name: futenis-server
    runtime: go
    plan: free
    region: virginia # closest Render region to the Río de la Plata
    buildCommand: go build -trimpath -o bin/server ./cmd/server
    startCommand: ./bin/server
    healthCheckPath: /healthz
    envVars:
      - key: FUTENIS_TRUST_PROXY
        value: "1"
      - key: FUTENIS_ORIGINS
        sync: false # e.g. futenis.vercel.app
