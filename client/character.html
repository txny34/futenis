<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>futenis · character preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0 0 96px 0; }
    #app canvas { width: 100%; height: 100%; display: block; }
    #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 96px; padding: 6px 12px; box-sizing: border-box; background: #161b22; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
    button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    button.on { background: #1f6feb; border-color: #388bfd; }
    label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
    .info { font-size: 12px; opacity: 0.7; margin-left: auto; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <script type="module" src="dist/preview.js"></script>
</body>
</html>
