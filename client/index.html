<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>futenis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap" />
  <link rel="stylesheet" href="styles/menu.css" />
  <link rel="stylesheet" href="styles/hud.css" />
  <link rel="stylesheet" href="styles/flow.css" />
  <link rel="stylesheet" href="styles/training.css" />
  <link rel="stylesheet" href="styles/lobby.css" />
  <link rel="stylesheet" href="styles/play-modal.css" />
  <link rel="stylesheet" href="styles/play-cards.css" />
  <link rel="stylesheet" href="styles/play-art.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #02040d; color: #e6edf3; font-family: system-ui, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #hud { position: fixed; inset: 0; pointer-events: none; --hud-scale: 1; }
    #hud[hidden] { display: none; }
    #msg { position: absolute; top: calc(58px * var(--hud-scale)); left: 50%; transform: translateX(-50%); font-size: calc(20px * var(--hud-scale)); text-shadow: 0 2px 6px #000; }
    #call { position: absolute; top: calc(92px * var(--hud-scale)); left: 50%; transform: translateX(-50%); font-size: calc(24px * var(--hud-scale)); font-weight: 700; color: #ffd23f; text-shadow: 0 2px 8px #000; }
    #fps { position: absolute; top: 8px; left: 12px; font: 12px ui-monospace, monospace; opacity: 0.8; }
    #help { position: absolute; bottom: 10px; left: 12px; font-size: calc(13px * var(--hud-scale)); opacity: 0.75; line-height: 1.5; }
    #err { position: absolute; top: 40%; width: 100%; text-align: center; color: #ff7b72; }
    #app canvas { cursor: crosshair; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
  <script src="dist/wasm_exec.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="ui"></div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
