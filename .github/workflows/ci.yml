name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go vet (wasm)
        run: GOOS=js GOARCH=wasm go vet ./wasm/
      - name: tests (race)
        run: go test -short -race ./...
      - name: sim coverage >= 95%
        run: bash scripts/ci/coverage-check.sh
      - name: build wasm + TS bundle
        run: go run ./cmd/dev -check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: TS unit tests (esbuild Go API + node --test)
        run: go run ./scripts/ci/tstest
      - name: staticcheck
        env:
          GOTOOLCHAIN: auto # staticcheck v0.8.1 needs go >= 1.26
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: install typecheck deps
        working-directory: scripts/ci/typecheck
        run: npm install --no-audit --no-fund
      - name: tsc (strict)
        working-directory: scripts/ci/typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: file size limits
        run: bash scripts/ci/size-check.sh
