name: deploy

# Runs after a green `ci` on main: online server to Fly.io (one machine, see
# fly.toml) and the static client to Vercel (built here: Vercel has no Go).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  server:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: fly deploy
        run: flyctl deploy --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  client:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: skip without a Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN secret not set; client deploy skipped"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.VERCEL_TOKEN != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.VERCEL_TOKEN != ''
        with:
          go-version-file: go.mod
      - name: build client
        if: env.VERCEL_TOKEN != ''
        run: FUTENIS_SERVER=wss://futenis-server.fly.dev go run ./cmd/dev -check
      - name: vercel deploy
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest deploy --cwd client --prod --yes --token "$VERCEL_TOKEN"
