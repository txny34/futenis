name: deploy

# Runs after a green `ci` on main: online server to Fly.io (one machine, see
# fly.toml) and the static client to Vercel (built here: Vercel has no Go).
# The server is redeployed only when the merge touches something in its image
# (.dockerignore drops client/, docs/, scripts/; .github/ never reaches the
# binary): a client-only change must not wake the Fly machine.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  server:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: server changed?
        id: changed
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if echo "$files" | grep -qvE '^(client/|docs/|scripts/|\.github/|[^/]*\.md$)'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "client/docs/ci only: Fly deploy skipped"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        if: steps.changed.outputs.server == 'true'
      - name: fly deploy
        if: steps.changed.outputs.server == 'true'
        run: flyctl deploy --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  client:
    needs: server # a new client may send messages only the new server knows
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: skip without a Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN secret not set; client deploy skipped"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.VERCEL_TOKEN != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: env.VERCEL_TOKEN != ''
        with:
          go-version-file: go.mod
      - name: build client
        if: env.VERCEL_TOKEN != ''
        run: FUTENIS_SERVER=wss://futenis-server.fly.dev go run ./cmd/dev -check
      - name: vercel deploy
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest deploy --cwd client --prod --yes --token "$VERCEL_TOKEN"
